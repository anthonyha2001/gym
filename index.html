<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Iron Log</title>
<meta name="description" content="A vanilla-JS PPL+ tracker for a Mon/Tue/Thu/Fri split, with weight/rep logging and automatic progressive-overload suggestions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f3; --bg-elev:#ffffff; --card:#ffffff; --card2:#eef0ed;
    --border:#dfe2de; --text:#15181a; --text-dim:#5b6560; --text-dimmer:#8b948e;
    --accent:#e8531f; --accent-ink:#ffffff; --accent-dim:#e8531f14;
    --green:#1f8f5f; --green-dim:#1f8f5f16;
    --amber:#b6791a; --amber-dim:#b6791a16;
    --danger:#c23b3b; --danger-dim:#c23b3b16;
    --radius:16px; --radius-sm:10px;
    --push:#e8531f; --pull:#1f6fb6; --legs:#1f8f5f; --full:#7a4fc7;
    --font-display:'Oswald', 'Arial Narrow', sans-serif;
    --font-body:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101312; --bg-elev:#171b19; --card:#181c1a; --card2:#1f2422;
      --border:#2a302c; --text:#f2f4f1; --text-dim:#98a29b; --text-dimmer:#636e66;
      --accent:#ff7440; --accent-ink:#101312; --accent-dim:#ff744022;
      --green:#4fd393; --green-dim:#4fd39322;
      --amber:#f0b64c; --amber-dim:#f0b64c22;
      --danger:#ff6b6b; --danger-dim:#ff6b6b22;
      --push:#ff7440; --pull:#5aa8f0; --legs:#4fd393; --full:#b28aff;
    }
  }
  :root[data-theme="dark"]{
    --bg:#101312; --bg-elev:#171b19; --card:#181c1a; --card2:#1f2422;
    --border:#2a302c; --text:#f2f4f1; --text-dim:#98a29b; --text-dimmer:#636e66;
    --accent:#ff7440; --accent-ink:#101312; --accent-dim:#ff744022;
    --green:#4fd393; --green-dim:#4fd39322;
    --amber:#f0b64c; --amber-dim:#f0b64c22;
    --danger:#ff6b6b; --danger-dim:#ff6b6b22;
    --push:#ff7440; --pull:#5aa8f0; --legs:#4fd393; --full:#b28aff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    padding-bottom:88px; position:relative;}

  header.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:blur(10px);padding:18px 18px 10px;border-bottom:1px solid var(--border);}
  header.top h1{font-family:var(--font-display);font-size:24px;font-weight:700;margin:0 0 2px;
    letter-spacing:0.3px;text-transform:uppercase;display:flex;align-items:center;gap:9px;}
  header.top .sub{font-size:12.5px;color:var(--text-dim);font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .icon{flex:0 0 auto;vertical-align:-3px;}
  .brand-mark{width:20px;height:20px;color:var(--accent);flex:0 0 auto;filter:drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 60%, transparent));}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .top-titles{min-width:0;flex:1 1 auto;}
  .header-cta{flex:0 0 auto;border:none;padding:10px 14px;border-radius:10px;font-size:11.5px;font-weight:800;
    cursor:pointer;font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;}
  .header-cta.start{background:var(--accent);color:var(--accent-ink);
    box-shadow:0 4px 14px -4px color-mix(in srgb, var(--accent) 55%, transparent);}
  .header-cta.finish{background:var(--green);color:var(--accent-ink);
    box-shadow:0 4px 14px -4px color-mix(in srgb, var(--green) 55%, transparent);}
  .header-cta.switch{background:var(--card2);color:var(--text-dim);border:1px solid var(--border);}
  .header-cta:active{transform:scale(0.97);}

  main{flex:1;padding:14px 16px 0;}
  section.view{display:none;}
  section.view.active{display:block;animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .daychips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;}
  .daychips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:700;
    font-family:var(--font-display);letter-spacing:0.3px;text-transform:uppercase;
    border:1px solid var(--border);color:var(--text-dim);background:var(--card);white-space:nowrap;cursor:pointer;}
  .chip.active{color:var(--accent-ink);background:var(--text);border-color:var(--text);}
  .chip .tag{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .chip .today-dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:currentColor;margin-left:6px;vertical-align:middle;opacity:0.7;}

  /* Timer card */
  .timer-card{background:linear-gradient(160deg, var(--card), var(--card2));border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 16px 14px;margin:12px 0;}
  .timer-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .timer-big{font-family:var(--font-display);font-size:40px;font-weight:700;letter-spacing:1px;
    font-variant-numeric:tabular-nums;line-height:1;}
  .timer-btns{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;}
  .timer-pause{background:var(--card2);border:1px solid var(--border);color:var(--text);
    padding:9px 16px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;
    font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.4px;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .timer-cancel{background:none;border:1px solid var(--danger-dim);color:var(--danger);
    padding:9px 16px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;
    font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.4px;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .timer-end{background:none;border:none;color:var(--text-dimmer);font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.3px;cursor:pointer;padding:4px;margin-top:8px;}
  .timer-bar{height:5px;background:var(--card2);border-radius:6px;margin-top:12px;overflow:hidden;}
  .timer-bar-fill{height:100%;background:var(--accent);border-radius:6px;transition:width 1s linear;}
  .timer-sub{font-size:11px;color:var(--text-dimmer);margin-top:7px;font-weight:500;}

  .start-block{text-align:center;padding:22px 16px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);margin:12px 0;}
  .start-block .est{font-size:12px;color:var(--text-dim);margin-bottom:14px;}
  .start-block button{width:100%;background:var(--accent);color:var(--accent-ink);border:none;padding:16px;
    border-radius:var(--radius-sm);font-size:15px;font-weight:800;cursor:pointer;letter-spacing:0.3px;
    font-family:var(--font-display);text-transform:uppercase;
    box-shadow:0 8px 24px -8px color-mix(in srgb, var(--accent) 55%, transparent);}
  .start-block button:active{transform:scale(0.98);}

  /* Rest bar */
  .rest-bar{position:fixed;left:0;right:0;bottom:68px;z-index:25;max-width:520px;margin:0 auto;
    background:var(--text);color:var(--bg);border-radius:14px 14px 0 0;padding:10px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    box-shadow:0 -6px 20px -6px #00000033;}
  .rest-bar.hidden{display:none;}
  .rest-bar .rest-info{display:flex;flex-direction:column;}
  .rest-bar .rest-label{font-size:10px;text-transform:uppercase;letter-spacing:0.4px;opacity:0.65;font-weight:700;}
  .rest-bar .rest-count{font-family:var(--font-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
  .rest-bar .rest-actions{display:flex;gap:6px;}
  .rest-bar .rest-actions button{background:color-mix(in srgb, var(--bg) 18%, transparent);color:var(--bg);
    border:none;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:700;cursor:pointer;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 16px;margin-bottom:12px;}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px;gap:10px;}
  .ex-name{font-size:16px;font-weight:700;letter-spacing:-0.1px;}
  .ex-meta{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .ex-target{font-size:11px;color:var(--text-dimmer);margin-top:1px;}

  .badge{font-size:10px;font-weight:800;padding:4px 9px;border-radius:20px;white-space:nowrap;
    text-transform:uppercase;letter-spacing:0.4px;flex:0 0 auto;
    display:inline-flex;align-items:center;gap:3px;}
  .badge.up{background:var(--green-dim);color:var(--green);}
  .badge.hold{background:var(--amber-dim);color:var(--amber);}
  .badge.new{background:var(--accent-dim);color:var(--accent);}

  table.sets{width:100%;border-collapse:collapse;margin-top:10px;}
  table.sets th{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-dimmer);
    text-align:center;font-weight:700;padding-bottom:6px;}
  table.sets th:first-child, table.sets td:first-child{text-align:left;padding-left:2px;}
  table.sets td{padding:4px 3px;text-align:center;}
  .set-input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-size:14px;text-align:center;padding:9px 2px;font-weight:700;
    font-variant-numeric:tabular-nums;}
  .set-input:focus{outline:none;border-color:var(--accent);}
  .set-input.done{border-color:var(--green);background:var(--green-dim);}
  .set-num{font-size:12.5px;color:var(--text-dim);font-weight:700;}
  .prev-hint{font-size:9.5px;color:var(--text-dimmer);display:block;margin-top:2px;font-variant-numeric:tabular-nums;}
  .rm-set{background:none;border:none;color:var(--text-dimmer);cursor:pointer;padding:4px;
    display:inline-flex;align-items:center;justify-content:center;}

  .row-actions{display:flex;gap:8px;margin-top:10px;}
  .btn-sm{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--text-dim);
    padding:9px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:5px;}
  .btn-sm:active{transform:scale(0.97);}
  .btn-sm.accent{color:var(--danger);border-color:var(--danger-dim);}

  .cta{position:sticky;bottom:70px;z-index:15;margin:14px 0 0;}
  .cta button{width:100%;background:var(--accent);color:var(--accent-ink);border:none;padding:16px;
    border-radius:var(--radius);font-size:15px;font-weight:800;cursor:pointer;letter-spacing:0.3px;
    font-family:var(--font-display);text-transform:uppercase;
    box-shadow:0 8px 24px -8px color-mix(in srgb, var(--accent) 55%, transparent);}
  .cta button:active{transform:scale(0.98);}
  .cta button:disabled{opacity:0.4;box-shadow:none;}
  .cta{display:flex;flex-direction:column;gap:8px;}
  .cta button.cancel-btn{width:100%;background:none;color:var(--danger);border:1px solid var(--danger-dim);
    padding:11px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;cursor:pointer;
    letter-spacing:0.3px;font-family:var(--font-display);text-transform:uppercase;box-shadow:none;}

  nav.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb, var(--bg-elev) 92%, transparent);
    backdrop-filter:blur(14px);border-top:1px solid var(--border);
    display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    max-width:520px;margin:0 auto;}
  nav.tabbar button{background:none;border:none;color:var(--text-dimmer);font-size:10px;font-weight:700;
    font-family:var(--font-display);letter-spacing:0.3px;text-transform:uppercase;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 10px;cursor:pointer;}
  nav.tabbar button.active{color:var(--text);}
  nav.tabbar svg{width:21px;height:21px;}

  h2.section-title{font-family:var(--font-display);font-size:13px;text-transform:uppercase;
    letter-spacing:0.8px;color:var(--text-dim);margin:18px 0 8px;font-weight:600;}
  h2.section-title:first-child{margin-top:4px;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  .stat-card .icon{display:block;color:var(--text-dimmer);margin-bottom:8px;}
  .stat-card .v{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:0.2px;
    font-variant-numeric:tabular-nums;}
  .stat-card .l{font-size:11px;color:var(--text-dim);margin-top:2px;font-weight:500;}

  .hist-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .hist-item .name{font-weight:700;font-size:14px;}
  .hist-item .date{font-size:11.5px;color:var(--text-dim);margin-top:1px;}
  .hist-item .vol{font-size:13px;font-weight:700;color:var(--text-dim);font-variant-numeric:tabular-nums;}

  select, .field{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
    padding:11px;border-radius:9px;font-size:13.5px;font-family:var(--font-body);}

  .empty{text-align:center;color:var(--text-dimmer);font-size:13px;padding:40px 20px;}
  .empty .icon{display:block;margin:0 auto 10px;opacity:0.5;}

  .prog-card{margin-bottom:16px;}
  .prog-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .prog-head .name{font-weight:700;font-size:14.5px;}
  .prog-head .delta{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;}
  .prog-head .delta.pos{color:var(--green);}
  .prog-head .delta.neg{color:var(--danger);}
  .prog-head .delta.flat{color:var(--text-dimmer);}
  canvas.chart{width:100%;height:80px;display:block;}

  .modal-bg{position:fixed;inset:0;background:#00000066;z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal-bg.hidden{display:none;}
  .modal{background:var(--bg-elev);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    border:1px solid var(--border);border-bottom:none;max-height:80vh;overflow-y:auto;}
  .modal h3{margin:0 0 12px;font-size:16px;font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.3px;}
  .modal label{display:block;font-size:11.5px;color:var(--text-dim);margin:10px 0 4px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.4px;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;font-size:13.5px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .modal-actions .cancel{background:var(--card2);color:var(--text-dim);}
  .modal-actions .save{background:var(--accent);color:var(--accent-ink);}
  .modal-actions .danger{background:var(--danger-dim);color:var(--danger);}

  .add-ex-btn{width:100%;background:var(--card2);border:1px dashed var(--border);color:var(--text-dim);
    padding:13px;border-radius:var(--radius);font-size:13px;font-weight:700;cursor:pointer;margin-top:2px;}

  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);
    padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:60;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}

  .badge.plateau{background:var(--danger-dim);color:var(--danger);}
  .warmup-line{font-size:10.5px;color:var(--text-dimmer);margin-top:3px;font-variant-numeric:tabular-nums;}

  .coach-banner{border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.4;
    display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;}
  .coach-banner.warn{background:var(--amber-dim);color:var(--amber);}
  .coach-banner.good{background:var(--green-dim);color:var(--green);}
  .coach-banner.info{background:var(--accent-dim);color:var(--accent);}
  .coach-banner.deload{background:var(--danger-dim);color:var(--danger);}
  .coach-banner button{background:none;border:1px solid currentColor;color:inherit;padding:7px 11px;
    border-radius:8px;font-size:10.5px;font-weight:800;cursor:pointer;white-space:nowrap;
    text-transform:uppercase;letter-spacing:0.3px;font-family:var(--font-display);flex:0 0 auto;}

  .opt-row{display:flex;gap:6px;margin-bottom:2px;}
  .opt-btn{flex:1;padding:9px 0;border-radius:9px;border:1px solid var(--border);background:var(--card2);
    color:var(--text-dim);font-weight:700;font-size:13px;cursor:pointer;}
  .opt-btn.selected{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

  .vol-row{margin-bottom:14px;}
  .vol-label{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;margin-bottom:5px;gap:8px;flex-wrap:wrap;}
  .vol-label .vol-count{font-size:10.5px;font-weight:600;color:var(--text-dim);}
  .vol-track{position:relative;height:10px;background:var(--card2);border-radius:6px;overflow:hidden;border:1px solid var(--border);}
  .vol-zone-mav{position:absolute;top:0;bottom:0;background:color-mix(in srgb, var(--green) 18%, transparent);}
  .vol-fill{position:absolute;top:0;left:0;bottom:0;border-radius:6px;transition:width .3s;}
  .vol-fill.under{background:var(--amber);}
  .vol-fill.ok{background:var(--green);}
  .vol-fill.over{background:var(--danger);}
  .vol-marker{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text-dimmer);}

  .day-nav{display:flex;align-items:center;justify-content:space-between;margin:10px 0 14px;}
  .day-nav button{background:var(--card);border:1px solid var(--border);color:var(--text);width:34px;height:34px;
    border-radius:10px;font-size:16px;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;}
  .day-nav .day-label{font-family:var(--font-display);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;}

  .pbar-row{margin-bottom:12px;}
  .pbar-row:last-of-type{margin-bottom:0;}
  .pbar-label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;margin-bottom:5px;}
  .pbar-label .lbl{display:inline-flex;align-items:center;gap:6px;}
  .pbar-label .sub{font-weight:600;color:var(--text-dim);font-size:11px;font-variant-numeric:tabular-nums;}
  .pbar-track{height:9px;background:var(--card2);border-radius:6px;overflow:hidden;border:1px solid var(--border);}
  .pbar-fill{height:100%;border-radius:6px;transition:width .3s;}
  .pbar-fill.cal{background:var(--accent);}
  .pbar-fill.protein{background:var(--green);}
  .pbar-fill.carbs{background:var(--full);}
  .pbar-fill.fat{background:var(--amber);}
  .pbar-fill.water{background:var(--pull);}

  .water-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .water-row .lbl{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-dimmer);}
  .water-btns{display:flex;gap:6px;}
  .water-btns button{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:7px 10px;
    border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;}

  .meal-card{margin-bottom:12px;}
  .meal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}

/* ---------------- State / Storage ---------------- */
const LS_KEY = "ironlog_v1";
let state = loadState();

function defaultState(){
  return {
    program: JSON.parse(JSON.stringify(DEFAULT_PROGRAM)),
    sessions: [],
    bodyweight: [],
    settings: { incUpper: 2.5, incLower: 5 },
    draft: {},
    activeSession: null, // { day, type, startTs, accumMs, running, readiness }
    prs: {}, // { [exerciseName]: { bestWeight:{value,date}, bestE1RM:{value,date}, bestVolume:{value,date} } }
    deload: { active: false, startDate: null },
    lastDeloadDate: null,
    exerciseGoals: {}, // { [exerciseName]: targetWeightKg } — powers the Growth Engine's goal-date projector
    nutrition: {
      goals: { calories: 2200, protein: 150, carbs: 220, fat: 70, water: 2500 },
      log: {}, // { 'YYYY-MM-DD': { water: ml, meals: { breakfast:[], lunch:[], dinner:[], snack:[] } } }
      barcodeCache: {} // { [barcode]: {name,serving,cal,p,c,f} } — grows as you scan/enter products
    },
    programVersion: PROGRAM_VERSION
  };
}

let programWasUpgraded = false;
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const d = defaultState();
    const merged = Object.assign(d, parsed, {
      program: parsed.program || d.program,
      settings: Object.assign(d.settings, parsed.settings||{}),
      // Deep-merge nutrition so new sub-fields (like barcodeCache) aren't lost for
      // returning users whose saved `nutrition` object predates them.
      nutrition: {
        goals: Object.assign(d.nutrition.goals, (parsed.nutrition&&parsed.nutrition.goals)||{}),
        log: (parsed.nutrition&&parsed.nutrition.log) || {},
        barcodeCache: (parsed.nutrition&&parsed.nutrition.barcodeCache) || {}
      }
    });
    // Pull in the newer built-in program (more volume, no deadlifts) for anyone still on an older version.
    if((parsed.programVersion||1) < PROGRAM_VERSION){
      merged.program = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
      merged.programVersion = PROGRAM_VERSION;
      merged.draft = {}; // clear in-progress drafts referencing old exercise names
      programWasUpgraded = true;
    }
    return merged;
  }catch(e){ return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* ---------------- Utils ---------------- */
function todayName(){ const d=new Date().getDay(); return DAYS[d===0?6:d-1]; }
function nextTrainingDay(){
  const idx = DAYS.indexOf(todayName());
  for(let i=1;i<=7;i++){
    const d = DAYS[(idx+i)%7];
    if(TRAIN_DAYS.includes(d)) return d;
  }
  return TRAIN_DAYS[0];
}
function fmtClock(ms){
  const total = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
  const mm = String(m).padStart(2,'0'), ss = String(s).padStart(2,'0');
  return h>0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function fmtDate(iso){ return new Date(iso).toLocaleDateString(undefined,{month:'short', day:'numeric'}); }
function fmtDateFull(iso){ return new Date(iso).toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric', year:'numeric'}); }
function isLower(name){ const n=name.toLowerCase(); return LOWER_KEYWORDS.some(k=>n.includes(k)); }

  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 1600);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function lastLoggedSets(exName){
  for(let i=state.sessions.length-1;i>=0;i--){
    const s = state.sessions[i];
    const ex = s.exercises.find(e=>e.name===exName);
    if(ex && ex.sets.some(st=>st.reps!=null && st.weight!=null)) return {session:s, ex};
  }
  return null;
}

// Up to `limit` most recent sessions that logged this exercise, oldest-first.
function exerciseHistory(exName, limit){
  const out = [];
  for(let i=state.sessions.length-1;i>=0 && out.length<limit;i--){
    const s = state.sessions[i];
    const ex = s.exercises.find(e=>e.name===exName);
    if(ex && ex.sets.some(st=>st.reps!=null && st.weight!=null)) out.unshift({session:s, ex});
  }
  return out;
}
function bestE1RMInSets(sets){
  let best = 0;
  sets.forEach(s=>{ if(s.reps>0){ const e = epley1RM(s.weight, s.reps); if(e>best) best=e; } });
  return best;
}
function avgRPE(sets){
  const vals = sets.filter(s=>s.rpe!=null).map(s=>s.rpe);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
// Flags a lift as stalled: best estimated 1RM across the last 3-4 sessions hasn't
// meaningfully grown (within 1%), which is the trigger for a deload/variation suggestion.
function detectPlateau(exName){
  const hist = exerciseHistory(exName, 4);
  if(hist.length<3) return false;
  const e1s = hist.map(h=>bestE1RMInSets(h.ex.sets));
  const first = e1s[0];
  if(first<=0) return false;
  const growth = (e1s[e1s.length-1]-first)/first;
  return growth <= 0.01;
}

function getSuggestion(progEx){
  const last = lastLoggedSets(progEx.name);
  const plateaued = last ? detectPlateau(progEx.name) : false;
  const deloadOn = !!(state.deload && state.deload.active);
  const readiness = (state.activeSession && state.activeSession.day===currentDay) ? state.activeSession.readiness : null;
  const notes = [];

  function applyModifiers(weight){
    let w = weight;
    if(deloadOn){ w *= 0.9; notes.push('Deload week: -10%'); }
    if(readiness && readiness.mult && readiness.mult!==1){
      w *= readiness.mult;
      notes.push(`Low readiness: -${Math.round((1-readiness.mult)*100)}%`);
    }
    return roundToIncrement(w, progEx);
  }

  if(!last){
    notes.push('First time logging this move');
    return {weight: applyModifiers(progEx.startWeight), badge:'new', note: notes.join(' · '), plateaued:false};
  }
  const {ex} = last;
  const [lo,hi] = progEx.repRange;
  const loggedSets = ex.sets.filter(s=>s.reps!=null);
  if(loggedSets.length===0){
    notes.push('No data yet');
    return {weight: applyModifiers(progEx.startWeight), badge:'new', note: notes.join(' · '), plateaued:false};
  }

  const lastWeight = loggedSets[loggedSets.length-1].weight ?? progEx.startWeight;
  const rpe = avgRPE(loggedSets);
  const highRpe = rpe!=null && rpe>8.5;
  const allAtTop = loggedSets.length>=progEx.sets && loggedSets.every(s=>s.reps>=hi);
  const anyBelowLo = loggedSets.some(s=>s.reps<lo);
  let badge, weight;

  if(plateaued && !allAtTop){
    badge = 'plateau'; weight = lastWeight;
    notes.push('Stalled for several sessions — try a deload, a rep-range change, or extra rest');
  } else if(allAtTop && !highRpe){
    const inc = isLower(progEx.name) ? state.settings.incLower : state.settings.incUpper;
    const bump = (rpe!=null && rpe<=7) ? inc*1.5 : inc;
    weight = lastWeight + bump; badge = 'up';
    notes.push(`Hit ${hi}+ reps all sets${rpe!=null?` @RPE ${rpe.toFixed(1)}`:''} — add weight`);
  } else if(allAtTop){
    weight = lastWeight; badge = 'hold';
    notes.push(`Reps hit but RPE ${rpe.toFixed(1)} was high — repeat and consolidate`);
  } else if(rpe!=null && rpe>=9.5){
    weight = lastWeight; badge = 'hold';
    notes.push(`RPE ${rpe.toFixed(1)} — too heavy, repeat weight`);
  } else if(anyBelowLo){
    weight = lastWeight; badge = 'hold';
    notes.push('Below target reps last time — repeat weight');
  } else {
    weight = lastWeight; badge = 'hold';
    notes.push(`Push for ${hi} reps to earn a weight jump`);
  }

  weight = applyModifiers(weight);
  return {weight, badge, note: notes.join(' · '), plateaued};
}

/* ---------------- Draft (in-progress workout) helpers ---------------- */
function getDraftDay(day){ if(!state.draft[day]) state.draft[day] = {}; return state.draft[day]; }
function getDraftEx(day, exName, defaultSetCount){
  const dd = getDraftDay(day);
  if(!dd[exName]) dd[exName] = { sets: Array.from({length:defaultSetCount}, ()=>({weight:null, reps:null, rpe:null})) };
  return dd[exName];
}

function collectDraftForFinish(){
  const type = DAY_TYPE[currentDay];
  return state.program[type].map(progEx=>{
    const draftEx = getDraftEx(currentDay, progEx.name, progEx.sets);
    return { name: progEx.name, isTimed: !!progEx.isTimed, sets: draftEx.sets.filter(s=>s.reps!=null) };
  }).filter(e=>e.sets.length>0);
}

// Updates each exercise's PR record (top weight / estimated 1RM / session volume) and
// returns human-readable strings for any bests that were just broken, for the finish toast.
function updatePRsAndCollect(exercises){
  const newPRs = [];
  exercises.forEach(e=>{
    if(!state.prs[e.name]) state.prs[e.name] = {};
    const rec = state.prs[e.name];
    const topWeight = Math.max(0, ...e.sets.map(s=>s.weight||0));
    const e1rm = bestE1RMInSets(e.sets);
    const vol = e.sets.reduce((a,s)=>a+(s.weight||0)*(s.reps||0),0);
    const now = new Date().toISOString();
    if(topWeight>0 && (!rec.bestWeight || topWeight>rec.bestWeight.value)){
      rec.bestWeight = {value:topWeight, date:now};
      newPRs.push(`${e.name} ${topWeight}${e.isTimed?'s':'kg'}`);
    }
    if(!rec.bestE1RM || e1rm>rec.bestE1RM.value) rec.bestE1RM = {value:e1rm, date:now};
    if(!rec.bestVolume || vol>rec.bestVolume.value) rec.bestVolume = {value:vol, date:now};
  });
  return newPRs;
}

function finishWorkout(){
  const exercises = collectDraftForFinish();
  if(exercises.length===0){ showToast("Log at least one set first"); return; }
  let durationMin, readiness = null;
  if(state.activeSession && state.activeSession.day===currentDay){
    durationMin = Math.round(sessionElapsedMs()/60000);
    readiness = state.activeSession.readiness;
    state.activeSession = null;
  }
  // readiness rides along on the session record (not just the live activeSession) so the
  // Growth Engine can build a real readiness trend across weeks, not just today's snapshot.
  const session = { id: uid(), date: new Date().toISOString(), type: DAY_TYPE[currentDay], day: currentDay, exercises, durationMin, readiness };
  state.sessions.push(session);
  const newPRs = updatePRsAndCollect(exercises);
  delete state.draft[currentDay];
  saveState();
  hideRest();
  if(newPRs.length){
    showToast(`New PR: ${newPRs[0]}${newPRs.length>1?` +${newPRs.length-1} more`:''}`);
  } else {
    showToast(durationMin ? `Workout saved — ${durationMin} min` : "Workout saved");
  }
  renderAll();
}

/* ---------------- Session timer ---------------- */
function sessionElapsedMs(){
  const s = state.activeSession;
  if(!s) return 0;
  return s.accumMs + (s.running ? Date.now()-s.startTs : 0);
}
function startWorkoutTimer(readiness){
  state.activeSession = { day: currentDay, type: DAY_TYPE[currentDay], startTs: Date.now(), accumMs: 0, running: true, readiness: readiness||null };
  saveState();
  renderAll();
  if(readiness && readiness.mult<1) showToast(`Check-in noted — today's suggestions trimmed ${Math.round((1-readiness.mult)*100)}%`);
}

// Quick 3-question check-in (sleep/soreness/energy) shown before starting a session; feeds
// a small intensity discount into getSuggestion() so a rough day doesn't get today's normal load.
function openReadinessModal(){
  const sel = {sleep:3, soreness:3, energy:3};
  const optionsRow = (key,label)=> `
    <label>${label}</label>
    <div class="opt-row" data-key="${key}">
      ${[1,2,3,4,5].map(v=>`<button type="button" class="opt-btn${v===3?' selected':''}" data-val="${v}">${v}</button>`).join('')}
    </div>`;
  openModal(`
    <h3>Quick Check-In</h3>
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;">1 = poor, 5 = great. Helps today's weights match how you actually feel.</div>
    ${optionsRow('sleep','Sleep quality')}
    ${optionsRow('soreness','Freshness (5 = no soreness)')}
    ${optionsRow('energy','Energy / motivation')}
    <div class="modal-actions">
      <button class="cancel" id="mSkip">Skip</button>
      <button class="save" id="mGo">Start Workout</button>
    </div>
  `);
  document.querySelectorAll('#modalContent .opt-row').forEach(row=>{
    row.addEventListener('click', e=>{
      const btn = e.target.closest('.opt-btn'); if(!btn) return;
      row.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');

  };
}
function pauseResumeTimer(){
  const s = state.activeSession; if(!s) return;
  if(s.running){ s.accumMs += Date.now()-s.startTs; s.running = false; }
  else { s.startTs = Date.now(); s.running = true; }
  saveState();
  renderTimerCard();
}
function cancelWorkout(){
  confirmModal(
    "Cancel workout?",

    "Cancel workout",

/* ---------------- Deload & coaching intelligence ---------------- */
function weeksSince(dateIso){
  if(!dateIso) return Infinity;
  return (Date.now()-new Date(dateIso).getTime())/(7*86400000);
}
function exerciseMuscle(name){
  for(const list of Object.values(state.program)){
    const found = list.find(e=>e.name===name);
    if(found && found.muscle) return found.muscle;
  }
  return null;
}
function allProgramExerciseNames(){
  const names = new Set();
  Object.values(state.program).forEach(list=>list.forEach(e=>names.add(e.name)));
  return [...names];
}
function plateauCount(){
  return allProgramExerciseNames().filter(n=>detectPlateau(n)).length;
}

/* ---------------- Growth Engine ----------------
   A stimulus-quality volume model + a composite, explainable Fatigue Index + a per-exercise
   Stimulus-to-Fatigue ranking + a regression-based goal-date projector. All computed from data
   already being logged (weight/reps/RPE, readiness check-ins, session duration) — no new
   tracking burden, just squeezing more signal out of what's already there. Every piece degrades
   gracefully ("not enough data yet") rather than guessing on thin data. */

// Not all sets drive growth equally — a set logged at RPE 9 is doing far more work than one at
// RPE 6. This converts a set into a 0.2-1.0 "how much did this actually count" weight, so volume
// tracking reflects real stimulus instead of just counting sets regardless of effort.
function effectiveSetWeight(set){
  if(set.rpe==null) return 0.5; // unlogged RPE: assume moderate effort, don't over- or under-credit it
  return Math.max(0.2, Math.min(1, (set.rpe-5)/5));
}
function weeklyEffectiveSetsByMuscle(){
  const totals = {};
  Object.keys(VOLUME_LANDMARKS).forEach(m=>totals[m]=0);
  const cutoff = Date.now()-7*86400000;
  state.sessions.forEach(s=>{
    if(new Date(s.date).getTime()<cutoff) return;
    s.exercises.forEach(e=>{
      const muscle = exerciseMuscle(e.name);
      if(!muscle || !(muscle in totals)) return;
      e.sets.forEach(st=>{ if(st.reps!=null) totals[muscle] += effectiveSetWeight(st); });
    });
  });
  Object.keys(totals).forEach(m=>totals[m]=round1(totals[m]));
  return totals;
}

// A single 0-100 score replacing the old binary "2 plateaus OR 6 weeks" deload rule. Each signal
// only contributes when there's enough data behind it, and the breakdown is shown in the UI —
// smart shouldn't mean a black box.
function computeFatigueIndex(){
  const factors = [];
  let score = 0;

  const pCount = Math.min(2, plateauCount());
  if(pCount>0){ const pts = pCount*15; score+=pts; factors.push({label:`${pCount} lift${pCount>1?'s':''} plateaued`, pts}); }

  const vol = weeklySetsByMuscle();
  const overCount = Math.min(2, Object.entries(VOLUME_LANDMARKS).filter(([m,land])=>(vol[m]||0)>land.mrv).length);
  if(overCount>0){ const pts = overCount*10; score+=pts; factors.push({label:`${overCount} muscle group${overCount>1?'s':''} over MRV this week`, pts}); }

  const wks = weeksSince(state.lastDeloadDate);
  if(isFinite(wks)){
    const pts = Math.round(Math.max(0, Math.min(1, (wks-3)/4))*25);
    if(pts>0){ score+=pts; factors.push({label:`${Math.floor(wks)} weeks since your last deload`, pts}); }
  }

  const withReadiness = state.sessions.filter(s=>s.readiness && s.readiness.score!=null);
  if(withReadiness.length>=6){
    const recent = withReadiness.slice(-3).reduce((a,s)=>a+s.readiness.score,0)/3;
    const prior = withReadiness.slice(-6,-3).reduce((a,s)=>a+s.readiness.score,0)/3;
    const drop = prior-recent;
    if(drop>0.3){ const pts = Math.round(Math.min(1,drop/2)*25); score+=pts; factors.push({label:'Readiness check-ins trending down', pts}); }
  }

  const timed = state.sessions.filter(s=>s.durationMin!=null);
  if(timed.length>=8){
    const recent = timed.slice(-3).reduce((a,s)=>a+s.durationMin,0)/3;
    const baseline = timed.slice(-8,-3).reduce((a,s)=>a+s.durationMin,0)/5;
    if(baseline>0 && recent>baseline*1.15){ const pts=15; score+=pts; factors.push({label:'Sessions taking longer than usual', pts}); }
  }

  return { score: Math.min(100, score), factors };
}
function deloadRecommended(){
  if(state.deload.active) return false;
  return computeFatigueIndex().score >= 55;
}

// Stimulus-to-Fatigue Ratio: growth per week, per unit of average RPE paid for it. High-SFR
// lifts are your best return on fatigue; low/negative-SFR lifts are stalling despite the cost —
// prime candidates for the Swap button. Needs >=4 logged sessions of a lift before ranking it.
function computeSFR(exName){
  const hist = exerciseHistory(exName, 8);
  if(hist.length<4) return null;
  const e1s = hist.map(h=>bestE1RMInSets(h.ex.sets));
  const first = e1s[0], last = e1s[e1s.length-1];
  if(first<=0) return null;
  const daysSpan = (new Date(hist[hist.length-1].session.date) - new Date(hist[0].session.date))/86400000;
  const weeksSpan = Math.max(1, daysSpan/7);
  const growthPerWeek = round1(((last-first)/first)/weeksSpan*100);
  const rpes = hist.flatMap(h=>h.ex.sets.filter(s=>s.rpe!=null).map(s=>s.rpe));
  const avgRpe = round1(rpes.length ? rpes.reduce((a,b)=>a+b,0)/rpes.length : 7.5);
  return { name: exName, growthPerWeek, avgRpe, sfr: Math.round((growthPerWeek/avgRpe)*100)/100 };
}
function rankExercisesBySFR(){
  return allProgramExerciseNames().map(computeSFR).filter(Boolean).sort((a,b)=>b.sfr-a.sfr);
}

// Plain least-squares linear regression of e1RM over time — no libraries needed for this.
function e1rmSeries(exName){
  const points = [];
  state.sessions.forEach(s=>{
    const ex = s.exercises.find(e=>e.name===exName);
    if(ex){ const e1 = bestE1RMInSets(ex.sets); if(e1>0) points.push({date:new Date(s.date), e1}); }
  });
  return points;
}
function linRegSlope(points){
  if(points.length<3) return null;
  const x0 = points[0].date.getTime();
  const xs = points.map(p=>(p.date.getTime()-x0)/86400000);
  const ys = points.map(p=>p.e1);
  const n = xs.length;
  const sumX = xs.reduce((a,b)=>a+b,0), sumY = ys.reduce((a,b)=>a+b,0);
  const sumXY = xs.reduce((a,x,i)=>a+x*ys[i],0), sumXX = xs.reduce((a,x)=>a+x*x,0);
  const denom = n*sumXX - sumX*sumX;
  if(denom===0) return null;
  const slope = (n*sumXY - sumX*sumY)/denom;
  const intercept = (sumY - slope*sumX)/n;
  return { slope, intercept, x0, lastX: xs[xs.length-1] };
}
function projectGoalDate(exName, targetWeight){
  const reg = linRegSlope(e1rmSeries(exName));
  if(!reg || reg.slope<=0.001) return null;
  const daysNeeded = (targetWeight - reg.intercept)/reg.slope;
  if(daysNeeded<=reg.lastX) return { alreadyThere:true };
  return { date: new Date(reg.x0 + daysNeeded*86400000), weeklyRate: round1(reg.slope*7) };
}
function fatigueGaugeSvg(score){
  const pct = Math.max(0,Math.min(100,score))/100;
  const r = 40, circ = 2*Math.PI*r;
  const color = score>=55?'var(--danger)':score>=30?'var(--amber)':'var(--green)';
  return `<svg width="92" height="92" viewBox="0 0 100 100" style="flex:0 0 auto;">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--card2)" stroke-width="10"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${circ*pct} ${circ}" transform="rotate(-90 50 50)"/>
    <text x="50" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="var(--text)" font-family="var(--font-display)">${score}</text>
    <text x="50" y="63" text-anchor="middle" font-size="8" fill="var(--text-dimmer)" letter-spacing="1">FATIGUE</text>

function startDeloadWeek(){
  state.deload = { active:true, startDate: new Date().toISOString() };
  saveState(); renderAll();
  showToast('Deload week started — intensity trimmed 10%');
}
function endDeloadWeek(){

  state.lastDeloadDate = new Date().toISOString();
  saveState(); renderAll();
  showToast('Deload week ended — back to normal training');

function checkDeloadExpiry(){
  if(state.deload && state.deload.active && weeksSince(state.deload.startDate)>=1){
    state.lastDeloadDate = state.deload.startDate;
    state.deload = { active:false, startDate:null };
    saveState();
  }
}
function computeStreak(){
  let streak = 0;
  const trainDates = new Set(state.sessions.map(s=> new Date(s.date).toDateString()));
  let cursor = new Date();
  for(let i=0;i<60;i++){
    const dname = DAYS[cursor.getDay()===0?6:cursor.getDay()-1];
    if(TRAIN_DAYS.includes(dname)){
      if(trainDates.has(cursor.toDateString())) streak++;
      else if(cursor.toDateString()!==new Date().toDateString()) break;
    }
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function weeklySetsByMuscle(){
  const totals = {};
  Object.keys(VOLUME_LANDMARKS).forEach(m=>totals[m]=0);
  const cutoff = Date.now()-7*86400000;
  state.sessions.forEach(s=>{
    if(new Date(s.date).getTime()<cutoff) return;
    s.exercises.forEach(e=>{
      const muscle = exerciseMuscle(e.name);
      if(!muscle || !(muscle in totals)) return;
      totals[muscle] += e.sets.filter(st=>st.reps!=null).length;
    });
  });
  return totals;
}
// Auto-generated coaching notes: plateaus, under/over-trained muscle groups (vs MEV/MRV),
// training frequency gaps, streaks, and recent PRs. Pure function over current state — no ML, just rules.
function generateInsights(){
  const out = [];
  if(state.deload.active) return out;
  allProgramExerciseNames().forEach(n=>{
    if(detectPlateau(n)) out.push({type:'warn', text:`${n} has stalled for a few sessions — consider a deload, a rep-range change, or extra rest before it.`});
  });
  const vol = weeklySetsByMuscle();
  Object.entries(VOLUME_LANDMARKS).forEach(([m,land])=>{
    const v = vol[m]||0;
    if(v>0 && v<land.mev) out.push({type:'warn', text:`${MUSCLE_LABEL[m]} is under-trained this week (${v}/${land.mev} MEV sets) — add a set or two.`});
    if(v>land.mrv) out.push({type:'warn', text:`${MUSCLE_LABEL[m]} volume this week (${v} sets) is above MRV (${land.mrv}) — watch fatigue.`});
  });
  TRAIN_DAYS.forEach(day=>{
    const type = DAY_TYPE[day];
    const lastSess = [...state.sessions].reverse().find(s=>s.type===type);
    const daysSince = lastSess ? (Date.now()-new Date(lastSess.date))/86400000 : Infinity;
    if(daysSince>10) out.push({type:'warn', text:`It's been ${Math.floor(daysSince)} days since your last ${TYPE_LABEL[type]} — get back on track.`});
  });
  const streak = computeStreak();
  if(streak>=4) out.push({type:'good', text:`${streak}-session streak — strong consistency, keep it going.`});
  const weekPRs = Object.values(state.prs||{}).filter(pr=> pr.bestWeight && (Date.now()-new Date(pr.bestWeight.date))/86400000<=7);
  if(weekPRs.length) out.push({type:'good', icon:'trophy', text:`${weekPRs.length} new PR${weekPRs.length>1?'s':''} this week — nice work.`});
  return out;
}

function chartColor(varName){
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || '#e8531f';

function drawLineChart(canvas, points, colorVar){
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  if(points.length===0) return;
  const color = chartColor(colorVar);
  const pad = 8;
  const vals = points.map(p=>p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min)||1;
  const stepX = points.length>1 ? (w-pad*2)/(points.length-1) : 0;
  ctx.beginPath();
  points.forEach((p,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((p.v-min)/range)*(h-pad*2);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.stroke();
  points.forEach((p,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((p.v-min)/range)*(h-pad*2);
    ctx.beginPath(); ctx.arc(x,y,3,0,7);
    ctx.fillStyle = color; ctx.fill();
  });
}

let foodDate = new Date();
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function shiftDate(d, days){ const nd = new Date(d); nd.setDate(nd.getDate()+days); return nd; }
function dayLabel(d){
  const key = dateKey(d);
  if(key===dateKey(new Date())) return 'Today';
  if(key===dateKey(shiftDate(new Date(),-1))) return 'Yesterday';
  if(key===dateKey(shiftDate(new Date(),1))) return 'Tomorrow';
  return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}
function round1(n){ return Math.round(n*10)/10; }

function ensureDayLog(key){
  if(!state.nutrition.log[key]) state.nutrition.log[key] = { water:0, meals:{breakfast:[],lunch:[],dinner:[],snack:[]} };
  return state.nutrition.log[key];
}
function getDayLog(key){
  return state.nutrition.log[key] || { water:0, meals:{breakfast:[],lunch:[],dinner:[],snack:[]} };
}
function dayTotals(day){
  let cal=0,p=0,c=0,f=0;
  MEAL_TYPES.forEach(m=> day.meals[m].forEach(e=>{ cal+=e.calories; p+=e.protein; c+=e.carbs; f+=e.fat; }));
  return {cal,p,c,f};
}
function addFoodEntry(key, meal, food, qty){
  const day = ensureDayLog(key);
  day.meals[meal].push({
    id: uid(), name: food.name, servingLabel: food.serving, qty,
    calories: Math.round(food.cal*qty), protein: round1(food.p*qty), carbs: round1(food.c*qty), fat: round1(food.f*qty)
  });
  saveState();
  renderFood();
}
function removeFoodEntry(key, meal, entryId){
  const day = state.nutrition.log[key]; if(!day) return;
  day.meals[meal] = day.meals[meal].filter(e=>e.id!==entryId);
  saveState(); renderFood();
}
function addWater(key, ml){
  const day = ensureDayLog(key);
  day.water = Math.max(0, day.water+ml);
  saveState(); renderFood();
}

function pbarHtml(iconName, label, val, goal, unit, cls){
  const pct = goal>0 ? Math.min(100,(val/goal)*100) : 0;
  return `<div class="pbar-row">
    <div class="pbar-label"><span class="lbl">${icon(iconName,13)}${label}</span><span class="sub">${Math.round(val)}${unit} / ${goal}${unit}</span></div>
    <div class="pbar-track"><div class="pbar-fill ${cls}" style="width:${pct}%"></div></div>
  </div>`;
}

  function renderResults(){
    const q = document.getElementById('foodSearchInput').value.trim().toLowerCase();
    const list = FOOD_DB.filter(f=> (activeCat==='all'||f.cat===activeCat) && (!q || f.name.toLowerCase().includes(q))).slice(0,40);
    const el = document.getElementById('foodResults');
    el.innerHTML = list.length ? list.map(f=>buildFoodRow(f, `data-id="${f.id}"`)).join('')
      : `<div class="empty" style="padding:20px 0;">${icon('search',24)}No local matches — try Scan, Custom, or wait for online results below.</div>`;
    el.querySelectorAll('.food-row').forEach(row=>{

  }
  // Supplements the fixed local FOOD_DB with a live Open Food Facts text search — this is what
  // turns "a few hundred foods" into "effectively any packaged product with a name match."
  function searchOnline(q){
    const el = document.getElementById('foodOnlineResults');
    if(!el) return;
    if(!q || q.length<2){ el.innerHTML=''; return; }
    el.innerHTML = `<div class="empty" style="padding:12px 0;font-size:11.5px;">${icon('search',18)}Searching Open Food Facts…</div>`;
    fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=12`)
      .then(r=>r.json())
      .then(data=>{
        if(document.getElementById('foodSearchInput').value.trim().toLowerCase()!==q) return; // stale response
        const products = (data.products||[]).map(p=>{
          const n = p.nutriments||{};
          const cal100 = n['energy-kcal_100g'];
          const rawName = p.product_name || p.generic_name || '';
          if(cal100==null || !rawName) return null;
          const brand = p.brands ? p.brands.split(',')[0].trim() : '';
          const name = brand && !rawName.toLowerCase().includes(brand.toLowerCase()) ? `${brand} ${rawName}` : rawName;
          return { name, serving:'100g', cal: round1(cal100), p: round1(n['proteins_100g']||0), c: round1(n['carbohydrates_100g']||0), f: round1(n['fat_100g']||0) };
        }).filter(Boolean).slice(0,10);
        if(!products.length){ el.innerHTML=''; return; }
        el.innerHTML = `<div class="online-label">${icon('search',12)}From Open Food Facts</div>` +
          products.map((f,i)=>buildFoodRow(f, `data-online-idx="${i}"`)).join('');
        el.querySelectorAll('.food-row').forEach(row=>{
          const f = products[parseInt(row.dataset.onlineIdx)];
          row.querySelector('.food-add-btn').onclick = ()=>{
            const qty = parseFloat(row.querySelector('.food-qty').value)||1;
            addFoodEntry(key, meal, f, qty);
            showToast(`Added ${f.name}`);
          };
        });
      })
      .catch(()=>{ el.innerHTML = ''; });
  }
  document.getElementById('foodSearchInput').addEventListener('input', ()=>{
    renderResults();
    clearTimeout(foodOnlineSearchTimer);
    const q = document.getElementById('foodSearchInput').value.trim().toLowerCase();
    foodOnlineSearchTimer = setTimeout(()=> searchOnline(q), 450);
  });
  document.querySelectorAll('#foodCatChips .chip').forEach(chip=>{
    chip.onclick = ()=>{
      document.querySelectorAll('#foodCatChips .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeCat = chip.dataset.cat;
      renderResults();
    };
  });
  document.getElementById('mScan').onclick = ()=> openBarcodeScanModal(meal, key);
  document.getElementById('mCustom').onclick = ()=> openCustomFoodModal(meal, key);
  document.getElementById('mDone').onclick = closeModal;
  renderResults();
}

/* ---------------- Barcode scanning ---------------- */
// There's no single official "Lebanon" barcode API. Open Food Facts is the largest free,
// open, no-key-required product database — imported brands sold in Lebanon are usually
// already in it (same barcode worldwide), but Lebanese-only local brands often aren't.
// Anything not found gets entered once via the custom-food form and cached forever on this
// device by its barcode, so the app effectively builds its own personal Lebanon database over time.
let activeScanner = null;
function stopScanner(){
  if(activeScanner){
    const s = activeScanner; activeScanner = null;
    try{ s.stop().then(()=>s.clear()).catch(()=>{}); }catch(e){}
  }
}
function cacheBarcodeProduct(code, food){
  state.nutrition.barcodeCache[code] = food;
  saveState();
}
async function lookupBarcodeOFF(code){
  const url = `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,quantity,nutriments`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  if(data.status!==1 || !data.product) return null;
  const p = data.product;
  const n = p.nutriments || {};
  const cal100 = n['energy-kcal_100g'];
  if(cal100==null) return null;
  const p100 = n['proteins_100g']||0, c100 = n['carbohydrates_100g']||0, f100 = n['fat_100g']||0;
  const qtyMatch = (p.quantity||'').match(/([\d.]+)\s*g\b/i);
  const packGrams = qtyMatch ? parseFloat(qtyMatch[1]) : null;
  const brand = p.brands ? p.brands.split(',')[0].trim() : '';
  const rawName = p.product_name || 'Unknown product';
  const name = brand && !rawName.toLowerCase().includes(brand.toLowerCase()) ? `${brand} ${rawName}` : rawName;
  if(packGrams){
    const scale = packGrams/100;
    return { name, serving: `1 pack (${packGrams}g)`,
      cal: round1(cal100*scale), p: round1(p100*scale), c: round1(c100*scale), f: round1(f100*scale) };
  }
  return { name, serving: '100g', cal: round1(cal100), p: round1(p100), c: round1(c100), f: round1(f100) };
}

// Camera scan (via html5-qrcode, loaded lazily off a CDN) with a manual digit-entry
// fallback that's always available — camera access can be unreliable on some setups.
function openBarcodeScanModal(meal, key){
  openModal(`
    <h3>Scan Barcode — ${MEAL_LABEL[meal]}</h3>
    <div id="scanReader"></div>
    <div id="scanCameraNote" class="empty" style="padding:8px 0;font-size:11.5px;"></div>
    <label style="margin-top:10px;">Or type the barcode number</label>
    <div style="display:flex;gap:8px;">
      <input class="field" id="scanManualInput" inputmode="numeric" placeholder="e.g. 6291234567890">
      <button class="btn-sm" style="flex:0 0 84px;color:var(--accent);border-color:var(--accent-dim);" id="scanLookupBtn">Look up</button>
    </div>
    <div id="scanResult"></div>
    <div class="modal-actions"><button class="cancel" id="mCancel">Close</button></div>
  `);
  document.getElementById('mCancel').onclick = closeModal;

  async function handleCode(code){
    stopScanner();
    const noteEl = document.getElementById('scanCameraNote');
    if(noteEl) noteEl.textContent = '';
    const resultEl = document.getElementById('scanResult');
    resultEl.innerHTML = `<div class="empty" style="padding:14px 0;">Looking up ${code}…</div>`;
    const cached = state.nutrition.barcodeCache[code];
    let food = cached || null;
    if(!food){
      try{ food = await lookupBarcodeOFF(code); }
      catch(e){ food = null; }
    }
    if(food){
      if(!cached) cacheBarcodeProduct(code, food);
      resultEl.innerHTML = `
        <div class="food-row">
          <div class="food-row-info">
            <div class="food-row-name">${food.name}</div>
            <div class="food-row-meta">${food.serving} · ${food.cal} kcal · P${food.p} C${food.c} F${food.f}${cached?' · saved on this device':''}</div>
          </div>
          <input type="number" class="food-qty" id="scanQty" value="1" step="0.25" min="0.1">
          <button class="food-add-btn" type="button" id="scanAddBtn">Add</button>
        </div>`;
      document.getElementById('scanAddBtn').onclick = ()=>{
        const qty = parseFloat(document.getElementById('scanQty').value)||1;
        addFoodEntry(key, meal, food, qty);
        showToast(`Added ${food.name}`);
      };
    } else {
      resultEl.innerHTML = `
        <div class="empty" style="padding:14px 0;">Not in the free food database yet (common for local Lebanese brands). Enter it once and it'll be remembered on this device from now on.</div>
        <button class="meal-add" id="scanEnterManually">Enter nutrition for this barcode</button>`;
      document.getElementById('scanEnterManually').onclick = ()=> openCustomFoodModal(meal, key, code);
    }
  }

  document.getElementById('scanLookupBtn').onclick = ()=>{
    const code = document.getElementById('scanManualInput').value.trim();
    if(!code){ showToast('Enter a barcode number'); return; }
    handleCode(code);
  };
  document.getElementById('scanManualInput').addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('scanLookupBtn').click();
  });

  if(typeof Html5Qrcode==='undefined'){
    document.getElementById('scanCameraNote').textContent = 'Camera scanner unavailable right now (offline, or still loading) — type the barcode number below.';
    return;
  }
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    document.getElementById('scanCameraNote').textContent = 'Camera not available in this browser — type the barcode number below.';
    return;
  }
  try{
    activeScanner = new Html5Qrcode('scanReader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
      ],
      verbose: false
    });
    activeScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 140 } },
      (decodedText)=>{ handleCode(decodedText); },
      ()=>{ /* per-frame miss, ignore */ }
    ).catch(()=>{
      const note = document.getElementById('scanCameraNote');
      if(note) note.textContent = 'Could not start the camera — type the barcode number below.';
      activeScanner = null;
    });
  }catch(e){
    document.getElementById('scanCameraNote').textContent = 'Could not start the camera — type the barcode number below.';
  }
}

// Best-effort mapping from wger's exercise categories to our internal muscle-group keys —
// used only to slot online results into volume-landmark tracking; unmapped categories keep
// the slot's existing muscle group rather than losing it.
const WGER_CATEGORY_TO_MUSCLE = {
  chest:'chest', back:'back', shoulders:'shoulders', arms:'biceps', legs:'quads', calves:'calves',
};
// wger.de is a free, open, no-key exercise database — used here so "Swap" isn't limited to our
// small built-in alternative list. Schema is best-effort parsed; any surprise just yields no results.
async function searchWgerExercises(term){
  const res = await fetch(`https://wger.de/api/v2/exercise/search/?term=${encodeURIComponent(term)}&language=english&format=json`);
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  const list = data.data || data.suggestions || [];
  return list.map(item=>{
    const d = item.data || item;
    const name = d.name || item.value;
    const category = (d.category||'').toString().toLowerCase();
    return name ? { name, category } : null;
  }).filter(Boolean).slice(0,15);
}

// "Swap" button on an exercise card: offers built-in alternatives targeting the same muscle
// group (for injuries, missing equipment, or just variety), plus a live wger.de search, and
// replaces that program slot with whichever one is picked.
function openSubstituteModal(exIdx){
  const type = DAY_TYPE[currentDay];
  const progEx = state.program[type][exIdx];
  const muscle = progEx.muscle;
  const alternatives = (ALT_EXERCISES[muscle]||[]).filter(a=> a.name!==progEx.name && !state.program[type].some(e=>e.name===a.name));

  function applySwap(newEx){
    state.program[type][exIdx] = newEx;
    delete getDraftDay(currentDay)[progEx.name];
    saveState(); closeModal(); renderAll();
    showToast(`Swapped in ${newEx.name}`);
  }

  openModal(`
    <h3>Swap ${progEx.name}</h3>
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;">Your logged history for ${progEx.name} stays in History either way.</div>
    ${alternatives.length ? `
      <div class="online-label">${icon('dumbbell',12)}Same muscle group${muscle?` (${MUSCLE_LABEL[muscle]})`:''}</div>
      <div id="subBuiltIn">
        ${alternatives.map((a,i)=>`
          <div class="hist-item sub-pick" style="cursor:pointer;" data-idx="${i}">
            <div class="l"><div class="name">${a.name}</div><div class="date">${a.sets} sets × ${a.repRange[0]}-${a.repRange[1]} reps</div></div>
            <div class="vol">${icon('chevronRight',16)}</div>
          </div>`).join('')}
      </div>` : ''}
    <label style="margin-top:14px;">Search more online (wger exercise database)</label>
    <div class="search-wrap">${icon('search',15)}<input class="field" id="subSearchInput" placeholder="e.g. incline press, lunge" autocomplete="off"></div>
    <div id="subOnlineResults"></div>
    <div class="modal-actions"><button class="cancel" id="mCancel">Cancel</button></div>
  `);
  document.getElementById('mCancel').onclick = closeModal;
  document.querySelectorAll('#subBuiltIn .sub-pick').forEach(item=>{
    item.onclick = ()=>{
      const alt = alternatives[parseInt(item.dataset.idx)];
      applySwap({ name:alt.name, sets:alt.sets, repRange:alt.repRange, startWeight:alt.startWeight, muscle, isTimed: !!alt.isTimed });
    };
  });

  let subSearchTimer = null;
  document.getElementById('subSearchInput').addEventListener('input', ()=>{
    clearTimeout(subSearchTimer);
    const term = document.getElementById('subSearchInput').value.trim();
    const el = document.getElementById('subOnlineResults');
    if(term.length<2){ el.innerHTML=''; return; }
    el.innerHTML = `<div class="empty" style="padding:12px 0;font-size:11.5px;">${icon('search',18)}Searching wger…</div>`;
    subSearchTimer = setTimeout(async ()=>{
      let results;
      try{ results = await searchWgerExercises(term); }
      catch(e){ el.innerHTML = `<div class="empty" style="padding:12px 0;font-size:11.5px;">Couldn't reach wger — check your connection.</div>`; return; }
      if(document.getElementById('subSearchInput').value.trim()!==term) return; // stale
      if(!results.length){ el.innerHTML = `<div class="empty" style="padding:12px 0;font-size:11.5px;">No matches — try different wording.</div>`; return; }
      el.innerHTML = results.map((r,i)=>`
        <div class="hist-item sub-online" style="cursor:pointer;" data-idx="${i}">
          <div class="l"><div class="name">${r.name}</div><div class="date">${r.category?r.category+' · ':''}wger.de</div></div>
          <div class="vol">${icon('chevronRight',16)}</div>
        </div>`).join('');
      el.querySelectorAll('.sub-online').forEach(item=>{
        item.onclick = ()=>{
          const r = results[parseInt(item.dataset.idx)];
          applySwap({ name:r.name, sets:3, repRange:[8,12], startWeight:10, muscle: WGER_CATEGORY_TO_MUSCLE[r.category] || muscle });
        };
      });
    }, 450);
  });
}

/* ---------------- Tabs ---------------- */
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  if(name==='history') renderHistory();
  if(name==='progress') renderProgress();
  if(name==='food') renderFood();
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab-btn').forEach(b=> b.onclick = ()=> switchView(b.dataset.view));

/* ---------------- Settings actions ---------------- */
document.getElementById('bwSaveBtn').onclick = ()=>{
  const v = parseFloat(document.getElementById('bwInput').value);
  if(!v){ showToast("Enter a number"); return; }
  state.bodyweight.push({date: new Date().toISOString(), kg:v});
  saveState(); document.getElementById('bwInput').value=''; showToast("Bodyweight logged");
};
document.getElementById('incUpper').addEventListener('change', e=>{ state.settings.incUpper = parseFloat(e.target.value)||2.5; saveState(); });
document.getElementById('incLower').addEventListener('change', e=>{ state.settings.incLower = parseFloat(e.target.value)||5; saveState(); });
document.getElementById('goalCal').addEventListener('change', e=>{ state.nutrition.goals.calories = parseFloat(e.target.value)||2200; saveState(); });
document.getElementById('goalProtein').addEventListener('change', e=>{ state.nutrition.goals.protein = parseFloat(e.target.value)||150; saveState(); });
document.getElementById('goalCarbs').addEventListener('change', e=>{ state.nutrition.goals.carbs = parseFloat(e.target.value)||220; saveState(); });
document.getElementById('goalFat').addEventListener('change', e=>{ state.nutrition.goals.fat = parseFloat(e.target.value)||70; saveState(); });
document.getElementById('goalWater').addEventListener('change', e=>{ state.nutrition.goals.water = parseFloat(e.target.value)||2500; saveState(); });
document.getElementById('exportBtn').onclick = async ()=>{
  try{
    const downloads = window.__ironlogDownloads || (await (window.claude && window.claude.use ? window.claude.use("downloads") : null));
    const json = JSON.stringify(state,null,2);
    if(downloads){
      await downloads.save({filename:'ironlog-backup.json', data:json});
      showToast("Backup saved");
    } else {
      showToast("Downloads unavailable here — copy from the box below");
      openModal(`<h3>Backup JSON</h3><textarea style="width:100%;height:220px;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px;font-size:11px;font-family:monospace;" readonly>${json.replace(/</g,'&lt;')}</textarea><div class="modal-actions"><button class="cancel" id="mCancel">Close</button></div>`);
      document.getElementById('mCancel').onclick = closeModal;
    }
  }catch(e){ showToast("Export failed"); }
};
document.getElementById('importBtn').onclick = ()=>{
  const input = document.createElement('input');
  input.type='file'; input.accept='application/json';
  input.onchange = ()=>{
    const file = input.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        state = Object.assign(defaultState(), parsed);
        saveState(); renderAll(); showToast("Data imported");
      }catch(e){ showToast("Invalid file"); }
    };
    reader.readAsText(file);
  };
  input.click();
};
document.getElementById('resetBtn').onclick = ()=>{
  confirmModal("Reset all data?", "This erases every logged session, bodyweight entry and custom exercise saved in this browser. This can't be undone.", "Reset everything", ()=>{
    state = defaultState(); saveState(); renderAll(); showToast("Data reset");
  });
};

/* ---------------- Wire up main actions ---------------- */
document.getElementById('addExBtn').onclick = openAddExerciseModal;
document.getElementById('progExSelect').addEventListener('change', renderProgress);

/* ---------------- Master render ---------------- */
function renderHeader(){
  const sub = document.getElementById('headerSub');
  const today = todayName();
  if(TRAIN_DAYS.includes(today)){
    sub.textContent = `Today is ${today} — ${TYPE_LABEL[DAY_TYPE[today]]}`;
  } else {
    const next = nextTrainingDay();
    sub.textContent = `Today is ${today} — rest day · next up: ${next} (${TYPE_LABEL[DAY_TYPE[next]]})`;
  }
}

function renderAll(){
  checkDeloadExpiry();
  renderHeader();
  renderHeaderCta();
  renderCoachBanner();
  renderDayChips();
  renderTimerCard();
  renderWorkoutBody();
  renderCta();
  document.getElementById('incUpper').value = state.settings.incUpper;
  document.getElementById('incLower').value = state.settings.incLower;
  document.getElementById('goalCal').value = state.nutrition.goals.calories;
  document.getElementById('goalProtein').value = state.nutrition.goals.protein;
  document.getElementById('goalCarbs').value = state.nutrition.goals.carbs;
  document.getElementById('goalFat').value = state.nutrition.goals.fat;
  document.getElementById('goalWater').value = state.nutrition.goals.water;
}

function start(savedData){
  if(savedData && savedData.state) state = savedData.state;
  renderAll();
  if(programWasUpgraded){ saveState(); showToast("Program upgraded: smarter coaching engine online"); }
}

if(window.claude && window.claude.use){
  window.claude.use("downloads").then(d=>{ window.__ironlogDownloads = d; }).catch(()=>{});
}
if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(()=>({state}));
  window.claude.hot.ready ? window.claude.hot.ready(start) : start(window.claude.hot.data);
} else {
  start();
}

window.closeModal = closeModal;

})();
</script>

</body>
</html>
